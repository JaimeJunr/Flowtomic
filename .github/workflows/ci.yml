name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile

      - name: Lint e formatação (Biome, repo inteiro)
        run: bun run biome check .

      # O type-check do ui lê os tipos do logic por project reference, então o
      # logic precisa estar buildado antes — mesma ordem do publish.yml.
      - name: logic — build
        run: bun run build
        working-directory: packages/logic

      - name: logic — testes
        run: bun run test:run
        working-directory: packages/logic

      - name: ui — type-check
        run: bun run type-check
        working-directory: packages/ui

      # `bun run test` no ui é o vitest em modo watch; o run explícito é obrigatório
      - name: ui — testes com cobertura
        run: bunx vitest run --coverage
        working-directory: packages/ui

      - name: registry — testes
        run: bun run test
        working-directory: registry

      - name: cli — testes
        run: bun run test
        working-directory: cli

      - name: registry — build
        run: bun run registry:build
